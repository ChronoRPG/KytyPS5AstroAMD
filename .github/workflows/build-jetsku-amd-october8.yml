name: Jetsku AMD - Rama de arreglos 8 octubre

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout AMD test branch at exact commit
        uses: actions/checkout@v4
        with:
          repository: Jetsku/KytyPS5
          ref: 07a6d2fabfc3b0f14ac65a49b20b2ce54eb0b1b7
          submodules: recursive

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
            if ($LASTEXITCODE -ne 0) {
              throw "glslang installation failed"
            }
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install LLVM 22.1.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.3-win64.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe' `
            -OutFile $installer
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/S', '/D=C:\LLVM-22.1.3' `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer exited with $($process.ExitCode)"
          }
          $version = & 'C:\LLVM-22.1.3\bin\clang-cl.exe' --version |
            Select-Object -First 1
          Write-Host $version
          if ($version -notmatch 'clang version 22\.1\.3\b') {
            throw "Unexpected clang-cl: $version"
          }
          foreach ($tool in 'lld-link.exe', 'llvm-lib.exe') {
            if (-not (Test-Path -LiteralPath "C:\LLVM-22.1.3\bin\$tool")) {
              throw "$tool missing"
            }
          }

      - name: Map the source to the PGO path
        shell: cmd
        run: |
          mklink /J C:\kyty-src "%GITHUB_WORKSPACE%"
          git config --global --add safe.directory C:/kyty-src

      - name: Configure Release with IPO and PGO
        shell: cmd
        run: |
          set LLVM=C:/LLVM-22.1.3/bin
          set PGO_PROFILE=C:/kyty-src/tools/pgo/u59-int9-sg-1.profdata
          cmake -S C:\kyty-src -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DKYTY_EMULATOR_IPO=ON ^
            -DKYTY_PGO_USE=%PGO_PROFILE% ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=%GITHUB_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=AMD-October8 ^
            -DCMAKE_C_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_CXX_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_LINKER=%LLVM%/lld-link.exe ^
            -DCMAKE_AR=%LLVM%/llvm-lib.exe ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Check the PGO source path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ninja = Get-Content -LiteralPath '_Build/windows/build.ninja' -Raw
          if (-not $ninja.Contains('C$:\kyty-src\src\emulator.cpp')) {
            throw 'The PGO source path does not match C:\kyty-src.'
          }
          Write-Host "MSVC tools $env:VCToolsVersion"

      - name: Build and install
        shell: cmd
        run: |
          set CL=-Wprofile-instr-missing
          cmake --build _Build/windows --target launcher kyty_emulator --parallel > pgo-build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          set CL=
          type pgo-build.log
          if %BUILD_EXIT% neq 0 exit /b %BUILD_EXIT%
          cmake --install _Build/windows --prefix _Build/windows/install

      - name: Show build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'pgo-build.log') {
            $lines = @(
              Get-Content -LiteralPath 'pgo-build.log' |
              Select-String -Pattern 'error|FAILED|fatal' |
              Select-Object -First 8
            )
            if (-not $lines) {
              $lines = @(
                Get-Content -LiteralPath 'pgo-build.log' |
                Select-Object -Last 8
              )
            }
            foreach ($line in $lines) {
              Write-Host (
                '::error::' +
                "$line".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              )
            }
          } else {
            Write-Host '::error::pgo-build.log was not written'
          }

      - name: Package AMD test build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:GITHUB_WORKSPACE '_Build/windows/install'
          $release = Join-Path $env:RUNNER_TEMP 'KytyPS5-AMD-October8'
          New-Item -ItemType Directory -Path $release | Out-Null

          Copy-Item -Path (Join-Path $runtime '*') `
            -Destination $release -Recurse
          Copy-Item -LiteralPath 'tools/u59-preset.json' `
            -Destination $release

          $presetPath = Join-Path $release 'u59-preset.json'
          $preset = Get-Content -LiteralPath $presetPath -Raw |
            ConvertFrom-Json
          $flags = @{
            KYTY_DEVICE_FAULT_DIAGNOSTICS = '1'
            KYTY_PS_HELPER_ATOMICS_SKIP = '1'
            KYTY_PIPELINE_FAST_FIRST = 'nvidia'
          }
          foreach ($key in $flags.Keys) {
            $preset | Add-Member `
              -NotePropertyName $key `
              -NotePropertyValue $flags[$key] `
              -Force
          }
          [IO.File]::WriteAllText(
            $presetPath,
            (ConvertTo-Json -InputObject $preset -Depth 8),
            [Text.UTF8Encoding]::new($false)
          )

          @'
          @echo off
          cd /d "%~dp0"
          echo Inicia Astro Bot con el interprete de ESTA carpeta.
          echo Esta compilacion usa los diagnosticos GPU de Jetsku.
          "%~dp0launcher.exe" %*
          pause
          '@ | Set-Content `
            -LiteralPath (Join-Path $release 'Diagnostico-AMD.cmd') `
            -Encoding ascii

          if (Test-Path -LiteralPath (Join-Path $release 'Kyty.ini')) {
            throw 'Unexpected local Kyty.ini in the package.'
          }

          Copy-Item -LiteralPath 'docs/EXPERIMENTAL.md' `
            -Destination (Join-Path $release 'U59-README.md')
          Copy-Item -LiteralPath 'LICENSE' -Destination $release
          Copy-Item -Path 'tools/amd-test-kit/*' -Destination $release
          Copy-Item -LiteralPath 'docs/release-notes.md' `
            -Destination (Join-Path $release 'AMD-release-notes.md')

          $fonts = Join-Path $release '3rdparty/tracy/profiler/src/font'
          New-Item -ItemType Directory -Path $fonts | Out-Null
          Copy-Item -Path '3rdparty/tracy/profiler/src/font/Roboto-*.ttf' `
            -Destination $fonts
          if (@(Get-ChildItem -LiteralPath $fonts -Filter 'Roboto-*.ttf').Count -ne 4) {
            throw 'Expected four Roboto fonts.'
          }
          Copy-Item -LiteralPath '3rdparty/SPIRV-Tools/LICENSE' `
            -Destination (Join-Path $fonts 'LICENSE-Apache-2.0.txt')

          foreach ($exe in 'launcher.exe', 'kyty_emulator.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $release $exe))) {
              throw "Missing executable: $exe"
            }
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE 'KytyPS5-AMD-October8.zip'
          Compress-Archive `
            -Path (Join-Path $release '*') `
            -DestinationPath $archive

      - name: Upload AMD test build
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-AMD-October8
          path: KytyPS5-AMD-October8.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMD-October8-build-log
          path: pgo-build.log
          if-no-files-found: ignore
          retention-days: 7
