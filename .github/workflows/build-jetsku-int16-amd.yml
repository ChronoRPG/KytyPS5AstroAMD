name: Jetsku int16.1 - Verificacion AMD - IPO PGO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout exact Jetsku int16.1 source
        uses: actions/checkout@v4
        with:
          ref: f9e19582f0deac0d1226a7ce3faae30a9ab408ab
          submodules: recursive

      - name: Verify existing AMD shader protection
        run: |
          $ErrorActionPreference = "Stop"

          $root = "src/graphics/shader/recompiler/backend/spirv"
          $internal = Get-Content "$root/spirvEmitterInternal.h" -Raw
          $module = Get-Content "$root/spirvEmitterModule.cpp" -Raw
          $flow = Get-Content "$root/spirvEmitterFlow.cpp" -Raw

          if (-not $internal.Contains("invalid_position_clip_distance") -or
              -not $module.Contains("state.invalid_position_clip_distance = clip_distance_count++") -or
              -not $flow.Contains("Shader: emitted zero-position clip guard") -or
              -not $flow.Contains("spv::OpFOrdEqual") -or
              -not $flow.Contains("ConstantF32Value(state, -1.0f)")) {
              throw "Expected zero-position protection missing"
          }

          Write-Host "Existing zero-position clip guard verified."
          Write-Host "No duplicate AMD patch applied."
          git rev-parse HEAD

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash

          "root=$vcpkgRoot" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"

          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
              vcpkg install glslang[tools,opt]:x64-windows
              if ($LASTEXITCODE -ne 0) {
                  throw "glslang installation failed"
              }
          }

          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
              Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install LLVM 22.1.3
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-22.1.3-win64.exe"

          Invoke-WebRequest `
              -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe" `
              -OutFile $installer

          $process = Start-Process `
              -FilePath $installer `
              -ArgumentList '/S', '/D=C:\LLVM-22.1.3' `
              -Wait `
              -PassThru

          if ($process.ExitCode -ne 0) {
              throw "LLVM installer exited with $($process.ExitCode)"
          }

          $version = & "C:\LLVM-22.1.3\bin\clang-cl.exe" --version |
              Select-Object -First 1

          Write-Host $version

          if ($version -notmatch 'clang version 22\.1\.3\b') {
              throw "Unexpected clang-cl: $version"
          }

          foreach ($tool in @("lld-link.exe", "llvm-lib.exe", "llvm-profdata.exe")) {
              if (-not (Test-Path "C:\LLVM-22.1.3\bin\$tool")) {
                  throw "$tool missing"
              }
          }

      - name: Map source to original PGO path
        shell: cmd
        run: |
          mklink /J C:\kyty-src "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b %ERRORLEVEL%
          git config --global --add safe.directory C:/kyty-src

      - name: Configure Release with IPO and PGO
        shell: cmd
        run: |
          set LLVM=C:/LLVM-22.1.3/bin
          set PGO_PROFILE=C:/kyty-src/tools/pgo/u59-int9-sg-1.profdata

          cmake -S C:\kyty-src -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DKYTY_EMULATOR_IPO=ON ^
            -DKYTY_PGO_USE=%PGO_PROFILE% ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=%GITHUB_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=Jetsku-int16.1-AMD-verification ^
            -DCMAKE_C_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_CXX_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_LINKER=%LLVM%/lld-link.exe ^
            -DCMAKE_AR=%LLVM%/llvm-lib.exe ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Check PGO source path and optimization flags
        run: |
          $ErrorActionPreference = "Stop"
          $ninja = Get-Content "_Build/windows/build.ninja" -Raw

          if (-not $ninja.Contains('C$:\kyty-src\src\emulator.cpp')) {
              throw "Unexpected source spelling: PGO would only partly apply"
          }

          if (-not $ninja.Contains("-fprofile-instr-use=")) {
              throw "PGO compiler flag missing"
          }

          if (-not $ninja.Contains("-flto")) {
              throw "IPO compiler flag missing"
          }

          Write-Host "PGO source path and IPO/PGO flags verified."
          Write-Host "MSVC tools: $env:VCToolsVersion"

      - name: Build and install
        shell: cmd
        run: |
          set CL=-Wprofile-instr-missing

          cmake --build _Build/windows --target launcher kyty_emulator --parallel > pgo-build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%

          set CL=
          type pgo-build.log

          if %BUILD_EXIT% neq 0 exit /b %BUILD_EXIT%

          cmake --install _Build/windows --prefix _Build/windows/install
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Show build errors
        if: failure()
        run: |
          if (Test-Path "pgo-build.log") {
              $lines = @(
                  Get-Content "pgo-build.log" |
                  Select-String -Pattern "error|FAILED|fatal" |
                  Select-Object -First 8
              )

              if (-not $lines) {
                  $lines = @(Get-Content "pgo-build.log" | Select-Object -Last 8)
              }

              foreach ($line in $lines) {
                  $message = "$line".Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                  Write-Host "::error::$message"
              }
          }

      - name: Report PGO coverage
        run: |
          $ErrorActionPreference = "Stop"
          $log = Get-Content "pgo-build.log"

          $sum = {
              param($pattern)
              (
                  $log |
                  Select-String -Pattern $pattern |
                  ForEach-Object { [int]$_.Matches[0].Groups[1].Value } |
                  Measure-Object -Sum
              ).Sum
          }

          $mismatched = & $sum 'profile data may be out of date: of \d+ functions?, (\d+)'
          $missing = & $sum 'profile data may be incomplete: of \d+ functions?, (\d+)'

          Write-Host "PGO: $([int]$mismatched) mismatched functions; $([int]$missing) functions without profile data."

          if ($mismatched -gt 0) {
              Write-Host "::warning::PGO: $mismatched functions have mismatched profile data"
          }

      - name: Package portable runtime
        run: |
          $ErrorActionPreference = "Stop"

          $runtime = Join-Path $env:GITHUB_WORKSPACE "_Build/windows/install"
          $release = Join-Path $env:RUNNER_TEMP "KytyPS5-Jetsku-int16.1-AMD"

          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item (Join-Path $runtime "*") -Destination $release -Recurse

          foreach ($exe in @("launcher.exe", "kyty_emulator.exe")) {
              if (-not (Test-Path (Join-Path $release $exe))) {
                  throw "Runtime executable missing: $exe"
              }
          }

          Copy-Item "tools/u59-preset.json" -Destination $release
          Copy-Item "docs/EXPERIMENTAL.md" -Destination (Join-Path $release "U59-README.md")
          Copy-Item "LICENSE" -Destination $release

          if (Test-Path (Join-Path $release "Kyty.ini")) {
              throw "Unexpected local Kyty.ini in package"
          }

          $fonts = Join-Path $release "3rdparty/tracy/profiler/src/font"
          New-Item -ItemType Directory -Path $fonts -Force | Out-Null

          Copy-Item "3rdparty/tracy/profiler/src/font/Roboto-*.ttf" -Destination $fonts

          if (@(Get-ChildItem $fonts -Filter "Roboto-*.ttf").Count -ne 4) {
              throw "Expected four Roboto fonts"
          }

          Copy-Item "3rdparty/SPIRV-Tools/LICENSE" `
              -Destination (Join-Path $fonts "LICENSE-Apache-2.0.txt")

          @'
          @echo off
          cd /d "%~dp0"
          "%~dp0launcher.exe" %*
          '@ | Set-Content (Join-Path $release "Prueba-Jetsku-AMD.cmd") -Encoding ascii

          @(
              "Exact Jetsku int16.1 source with original IPO and imported PGO.",
              "Existing zero-position protection verified; no additional AMD fix claimed.",
              "Copy _Patches and kyty_settings.ini from your working build.",
              "First run: do not copy the old _PipelineCache.",
              "AMD CPU patch OFF; shader validation OFF; red-zone ON.",
              "Select the interpreter in THIS folder.",
              "Warm up before measuring heavy and light views."
          ) | Set-Content (Join-Path $release "PRUEBA-AMD.txt") -Encoding ascii

          $archive = Join-Path $env:GITHUB_WORKSPACE "KytyPS5-Jetsku-int16.1-AMD.zip"

          Compress-Archive `
              -Path (Join-Path $release "*") `
              -DestinationPath $archive `
              -Force

          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -eq 0) {
              throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Jetsku-int16.1-AMD
          path: KytyPS5-Jetsku-int16.1-AMD.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jetsku-AMD-PGO-log
          path: pgo-build.log
          if-no-files-found: ignore
          retention-days: 7
