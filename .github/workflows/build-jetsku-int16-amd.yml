name: Jetsku AMD - Diagnostico de fallo GPU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout exact Jetsku source
        uses: actions/checkout@v4
        with:
          ref: f9e19582f0deac0d1226a7ce3faae30a9ab408ab
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add device-loss report to presentation errors
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          path = Path("src/graphics/presentation/window/swapchain.cpp")
          source = path.read_text(encoding="utf-8")

          for call in ("vkAcquireNextImageKHR", "vkQueuePresentKHR"):
              old = (
                  '\t\tdefault: EXIT("' + call +
                  ' failed: %s\\n", vk::to_string(result).c_str());'
              )
              if source.count(old) != 1:
                  raise RuntimeError("Unexpected error boundary: " + call)

              new = (
                  "\t\tcase vk::Result::eErrorDeviceLost:\n"
                  "\t\t\tDumpDeviceLossDiagnostics(m_window.graphic_ctx);\n"
                  '\t\t\tEXIT("' + call +
                  ' failed: %s\\n", vk::to_string(result).c_str());\n'
                  "\t\t\tbreak;\n" + old
              )
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8", newline="\n")
          print("Device-loss reporting installed at acquire and present.")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
              throw "Diagnostic adaptation failed"
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) {
              throw "Invalid diagnostic diff"
          }

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Locate vcpkg
        id: vcpkg
        run: |
          $ErrorActionPreference = "Stop"
          $root = Split-Path (Get-Command vcpkg).Source
          $hash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$root" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "hash=$hash" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.hash }}-tools-opt

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $root = "${{ steps.vcpkg.outputs.root }}"

          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
              vcpkg install glslang[tools,opt]:x64-windows
              if ($LASTEXITCODE -ne 0) {
                  throw "glslang installation failed"
              }
          }

          "$root\installed\x64-windows\tools\glslang" |
              Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install LLVM 22.1.3
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-22.1.3-win64.exe"

          Invoke-WebRequest `
              -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe" `
              -OutFile $installer

          $process = Start-Process `
              -FilePath $installer `
              -ArgumentList '/S', '/D=C:\LLVM-22.1.3' `
              -Wait `
              -PassThru

          if ($process.ExitCode -ne 0) {
              throw "LLVM installation failed"
          }

          $version = & "C:\LLVM-22.1.3\bin\clang-cl.exe" --version |
              Select-Object -First 1

          if ($version -notmatch 'clang version 22\.1\.3\b') {
              throw "Unexpected LLVM version: $version"
          }

      - name: Map source to PGO path
        shell: cmd
        run: |
          mklink /J C:\kyty-src "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b %ERRORLEVEL%
          git config --global --add safe.directory C:/kyty-src

      - name: Configure IPO and PGO
        shell: cmd
        run: |
          set LLVM=C:/LLVM-22.1.3/bin
          cmake -S C:\kyty-src -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DKYTY_EMULATOR_IPO=ON ^
            -DKYTY_PGO_USE=C:/kyty-src/tools/pgo/u59-int9-sg-1.profdata ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=%GITHUB_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=AMD-device-loss-diagnostic ^
            -DCMAKE_C_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_CXX_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_LINKER=%LLVM%/lld-link.exe ^
            -DCMAKE_AR=%LLVM%/llvm-lib.exe ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Verify PGO path
        run: |
          $ErrorActionPreference = "Stop"
          $ninja = Get-Content "_Build/windows/build.ninja" -Raw

          if (-not $ninja.Contains('C$:\kyty-src\src\emulator.cpp')) {
              throw "Unexpected PGO source path"
          }

          if (-not $ninja.Contains("-fprofile-instr-use=") -or
              -not $ninja.Contains("-flto")) {
              throw "IPO or PGO flags missing"
          }

      - name: Build and install
        shell: cmd
        run: |
          set CL=-Wprofile-instr-missing
          cmake --build _Build/windows --target launcher kyty_emulator --parallel > pgo-build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          set CL=
          type pgo-build.log
          if %BUILD_EXIT% neq 0 exit /b %BUILD_EXIT%

          cmake --install _Build/windows --prefix _Build/windows/install
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Package diagnostic runtime
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:GITHUB_WORKSPACE "_Build/windows/install"

          foreach ($exe in @("launcher.exe", "kyty_emulator.exe")) {
              if (-not (Test-Path (Join-Path $runtime $exe))) {
                  throw "Missing executable: $exe"
              }
          }

          Copy-Item "tools/u59-preset.json" -Destination $runtime

          $env:KYTY_PACKAGE_RUNTIME = $runtime
          @'
          import json
          import os
          from pathlib import Path

          runtime = Path(os.environ["KYTY_PACKAGE_RUNTIME"])
          path = runtime / "u59-preset.json"
          preset = json.loads(path.read_text(encoding="utf-8-sig"))
          preset["KYTY_DEVICE_FAULT_DIAGNOSTICS"] = "1"
          preset["KYTY_FUNCTION_ARRAY_SHRINK"] = "0"
          path.write_text(
              json.dumps(preset, indent=2) + "\n",
              encoding="utf-8"
          )
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
              throw "Diagnostic preset generation failed"
          }

          Copy-Item "docs/EXPERIMENTAL.md" -Destination (Join-Path $runtime "U59-README.md")
          Copy-Item "LICENSE" -Destination $runtime

          $fonts = Join-Path $runtime "3rdparty/tracy/profiler/src/font"
          New-Item -ItemType Directory -Path $fonts -Force | Out-Null
          Copy-Item "3rdparty/tracy/profiler/src/font/Roboto-*.ttf" -Destination $fonts

          Copy-Item "3rdparty/SPIRV-Tools/LICENSE" `
              -Destination (Join-Path $fonts "LICENSE-Apache-2.0.txt")

          @'
          @echo off
          cd /d "%~dp0"
          "%~dp0launcher.exe" %*
          '@ | Set-Content (Join-Path $runtime "Diagnostico-Jetsku-AMD.cmd") -Encoding ascii

          @(
              "Device-loss diagnostic build; not a crash fix.",
              "Original Jetsku base with IPO and imported PGO.",
              "Device-fault diagnostics ON; function-array shrink OFF.",
              "Copy _Patches and select THIS interpreter.",
              "Keep AMD CPU patch OFF, shader validation OFF, red-zone ON.",
              "Send the full console after the crash."
          ) | Set-Content (Join-Path $runtime "DIAGNOSTICO-AMD.txt") -Encoding ascii

          Compress-Archive `
              -Path (Join-Path $runtime "*") `
              -DestinationPath "KytyPS5-Jetsku-AMD-Diagnostico.zip" `
              -Force

          if (-not (Test-Path "KytyPS5-Jetsku-AMD-Diagnostico.zip") -or
              (Get-Item "KytyPS5-Jetsku-AMD-Diagnostico.zip").Length -eq 0) {
              throw "Packaging failed"
          }

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Jetsku-AMD-Diagnostico
          path: KytyPS5-Jetsku-AMD-Diagnostico.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jetsku-AMD-Diagnostic-Compiler-log
          path: pgo-build.log
          if-no-files-found: ignore
          retention-days: 7
